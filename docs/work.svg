<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-labelledby="title desc">
  <title id="title">The work tab in pergula</title>
  <desc id="desc">The work tab lists the worktrees of two repositories. One card turns from active to merged, waiting for the sweep, and offers the command that tears it down, which a click copies. Another was left behind, and says why wt-down would refuse it.</desc>

  <!-- Colours are the :root tokens in pergula. The repositories, worktrees, sessions and hosts are made up. -->
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ripple { transform-box: fill-box; transform-origin: center; opacity: 0; }
    /* Still frame first: the card merged and the command on offer. */
    .tab-s, .c0, .c1, .chipA, .dotA, .aheadA, .c1-short, .copied, .cursor { opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .tab-s { animation: tab-s 16s step-end infinite; }
      .tab-w { animation: tab-w 16s step-end infinite; }
      .pane { animation: pane 16s ease-in-out infinite; }
      .scroll { animation: scroll 16s ease-in-out infinite; }
      .c0 { animation: c0 16s step-end infinite; }
      .c1 { animation: c1 16s step-end infinite; }
      .c2 { animation: c2 16s step-end infinite; }
      .in1 { animation: in1 16s ease-out infinite; }
      .in2 { animation: in2 16s ease-out infinite; }
      .shift { animation: shift 16s ease-in-out infinite; }
      .chipA, .dotA, .aheadA, .c1-short { animation: before 16s ease-in-out infinite; }
      .chipM, .dotM, .aheadM, .c1-tall { animation: after 16s ease-in-out infinite; }
      .c1-short { animation-name: shortcard; }
      .td1 { animation: td1 16s ease-out infinite; }
      .copy { animation: copy 16s step-end infinite; }
      .copied { animation: copied 16s step-end infinite; }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      .r1 { animation: r1 16s ease-out infinite; }
      .r2 { animation: r2 16s ease-out infinite; }
      .cursor { animation: cur 16s ease-in-out infinite; }
    }
    @keyframes tab-s { 0% { opacity: 1; } 6.25% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes tab-w { 0% { opacity: 0; } 6.25% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes pane { 0%, 6.5% { opacity: 0; } 9.5%, 96% { opacity: 1; } 99%, 100% { opacity: 0; } }
    @keyframes scroll { 0%, 68.75% { transform: translateY(0); } 75%, 99% { transform: translateY(-116px); } 100% { transform: translateY(0); } }
    @keyframes c0 { 0% { opacity: 1; } 9.4% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes c1 { 0% { opacity: 0; } 9.4% { opacity: 1; } 13% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes c2 { 0% { opacity: 0; } 13% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes in1 { 0%, 8% { opacity: 0; transform: translateY(6px); } 12%, 100% { opacity: 1; transform: translateY(0); } }
    @keyframes in2 { 0%, 10% { opacity: 0; transform: translateY(6px); } 14%, 100% { opacity: 1; transform: translateY(0); } }
    @keyframes shift { 0%, 40% { transform: translateY(-37px); } 45%, 100% { transform: translateY(0); } }
    @keyframes before { 0%, 37.5% { opacity: 1; } 40.5%, 100% { opacity: 0; } }
    @keyframes after { 0%, 37.5% { opacity: 0; } 40.5%, 100% { opacity: 1; } }
    @keyframes shortcard { 0%, 41% { opacity: 1; } 42.5%, 100% { opacity: 0; } }
    @keyframes td1 { 0%, 40.5% { opacity: 0; transform: translateY(-8px); } 45%, 100% { opacity: 1; transform: translateY(0); } }
    @keyframes copy { 0% { opacity: 1; } 56.25% { opacity: 0; } 67.5% { opacity: 1; } 100% { opacity: 1; } }
    @keyframes copied { 0% { opacity: 0; } 56.25% { opacity: 1; } 67.5% { opacity: 0; } 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
    @keyframes r1 { 0%, 6% { opacity: 0; transform: scale(.2); } 6.5% { opacity: .55; transform: scale(.4); } 11%, 100% { opacity: 0; transform: scale(1.6); } }
    @keyframes r2 { 0%, 55.8% { opacity: 0; transform: scale(.2); } 56.3% { opacity: .55; transform: scale(.4); } 61%, 100% { opacity: 0; transform: scale(1.6); } }
    @keyframes cur { 0%, 2% { opacity: 0; transform: translate(520px, 190px); } 4% { opacity: 1; transform: translate(520px, 190px); } 6% { transform: translate(200px, 94px); } 6.5% { transform: translate(200px, 94px) scale(.9); } 7.2% { opacity: 1; transform: translate(200px, 94px); } 13% { opacity: 1; transform: translate(430px, 250px); } 16%, 48% { opacity: 0; transform: translate(430px, 250px); } 49% { opacity: 0; transform: translate(560px, 330px); } 51% { opacity: 1; transform: translate(560px, 330px); } 55.5% { opacity: 1; transform: translate(672px, 303px); } 56.3% { transform: translate(672px, 303px) scale(.9); } 57.5% { opacity: 1; transform: translate(672px, 303px); } 62%, 100% { opacity: 0; transform: translate(690px, 330px); } }
  </style>

