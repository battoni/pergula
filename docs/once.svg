<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 422" width="760" height="422" role="img" aria-labelledby="title desc">
  <title id="title">Each response counted once</title>
  <desc id="desc">Nine lines across a session, the session that continues it and a fork of it hold four responses: adding up lines counts nine calls, pergula counts four, with the output of each one's last line.</desc>

  <!-- Colours are the :root tokens in pergula. The projects and sessions are made up. -->
