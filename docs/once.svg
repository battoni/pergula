    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ripple { transform-box: fill-box; transform-origin: center; }
    .l1 { animation: l1 14s ease-out infinite; }
    @keyframes l1 { 0%, 6.0% { opacity: 0; transform: translateX(-6px); } 8.0%, 94% { opacity: 1; transform: translateX(0); } 98%, 100% { opacity: 0; transform: translateX(0); } }
