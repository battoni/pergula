<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-labelledby="title desc">
  <title id="title">Switching sessions in pergula</title>
  <desc id="desc">A click or cmd and a number moves to another session, and the transcript is on screen in the same moment.</desc>

  <!-- Colours are the :root tokens in pergula. The projects and sessions are made up. -->
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ripple { transform-box: fill-box; transform-origin: center; }

    .hl { animation: hl 10s ease-in-out infinite; }
    .pa { animation: pa 10s step-end infinite; }
    .pb { animation: pb 10s step-end infinite; }
    .pc { animation: pc 10s step-end infinite; }
    .cursor { animation: cur 10s ease-in-out infinite; }
    .rp { animation: rp 10s ease-out infinite; }
    .k6 { animation: k6 10s ease-out infinite; }
    .k3 { animation: k3 10s ease-out infinite; }
    @keyframes hl { 0%, 18% { transform: translateY(0); } 18.6%, 52% { transform: translateY(-104px); } 52.6%, 86% { transform: translateY(96px); } 86.6%, 100% { transform: translateY(0); } }
    @keyframes pa { 0% { opacity: 1; } 18.3% { opacity: 0; } 86.3% { opacity: 1; } }
    @keyframes pb { 0% { opacity: 0; } 18.3% { opacity: 1; } 52.3% { opacity: 0; } }
    @keyframes pc { 0% { opacity: 0; } 52.3% { opacity: 1; } 86.3% { opacity: 0; } }
    @keyframes cur { 0%, 4% { opacity: 0; transform: translate(560px, 330px); } 7% { opacity: 1; transform: translate(560px, 330px); } 16%, 18% { opacity: 1; transform: translate(150px, 166px); } 17% { transform: translate(150px, 166px) scale(.9); } 28% { opacity: 1; transform: translate(150px, 166px); } 32%, 100% { opacity: 0; transform: translate(150px, 166px); } }
    @keyframes rp { 0%, 17% { opacity: 0; transform: scale(.2); } 18% { opacity: .55; transform: scale(.4); } 25%, 100% { opacity: 0; transform: scale(1.6); } }
    @keyframes k6 { 0%, 44% { opacity: 0; transform: translateY(6px); } 46%, 56% { opacity: 1; transform: translateY(0); } 60%, 100% { opacity: 0; transform: translateY(0); } }
    @keyframes k3 { 0%, 78% { opacity: 0; transform: translateY(6px); } 80%, 90% { opacity: 1; transform: translateY(0); } 94%, 100% { opacity: 0; transform: translateY(0); } }
    /* Without motion, the frame that shows the feature. */
    @media (prefers-reduced-motion: reduce) {
      .hl, .pa, .pb, .pc, .cursor, .rp, .k6, .k3 { animation: none; }
      .pb, .pc, .cursor, .rp, .k6, .k3 { opacity: 0; }
    }
  </style>

  <defs>
    <clipPath id="window"><rect width="760" height="460" rx="12"/></clipPath>
    <clipPath id="rail"><rect x="0" y="28" width="240" height="432"/></clipPath>
    <clipPath id="pane"><rect x="241" y="29" width="519" height="431"/></clipPath>
  </defs>

  <g clip-path="url(#window)">
    <rect width="760" height="460" fill="#14120f"/>

    <rect width="760" height="28" fill="#191614"/>
    <circle cx="16" cy="14" r="5" fill="#ec6a5e"/>
    <circle cx="32" cy="14" r="5" fill="#f4bf4f"/>
    <circle cx="48" cy="14" r="5" fill="#61c554"/>
    <text x="380" y="18" font-size="11" fill="#6f665e" text-anchor="middle">pergula</text>
    <line x1="0" y1="28.5" x2="760" y2="28.5" stroke="#322c28"/>

    <rect x="0" y="29" width="240" height="431" fill="#191614"/>
    <line x1="240.5" y1="29" x2="240.5" y2="460" stroke="#322c28"/>
    <g transform="translate(20 46) scale(.05)" fill="#c0e021">
      <path d="M32 32 L480 32 L480 128 L32 128 Z"/>
      <path d="M32 192 L288 192 L352 288 L32 288 Z"/>
      <path d="M288 352 L480 352 L480 448 L352 448 Z"/>
    </g>
    <text x="50" y="65" font-size="19" fill="#c0e021" font-weight="600">pergula</text>

    <rect x="16.5" y="88.5" width="207" height="30" rx="8" fill="#12100e" stroke="#322c28"/>
    <text x="28" y="108" font-size="11.5" fill="#6f665e">filter project or session</text>
<g class="hl"><rect x="10" y="261" width="220" height="22" rx="6" fill="#232020"/><rect x="10" y="261" width="2.5" height="22" fill="#c0e021"/></g><text x="20" y="150" font-size="11" fill="#f2ece4" font-weight="700">LEDGER</text><text x="220" y="150" font-size="10.5" fill="#6f665e" text-anchor="end">1</text><circle cx="30" cy="168" r="3.5" fill="#85b06b"/><text x="42" y="172" font-size="12" fill="#ddd5cb">Reconcile the March imports</text><text x="20" y="202" font-size="11" fill="#f2ece4" font-weight="700">atlas-api</text><text x="220" y="202" font-size="10.5" fill="#6f665e" text-anchor="end">1</text><circle cx="30" cy="220" r="3.5" fill="#f0a03c"/><text x="42" y="224" font-size="12" fill="#ddd5cb">Rate limits on the public routes</text><text x="20" y="254" font-size="11" fill="#f2ece4" font-weight="700">ORCHARD</text><text x="220" y="254" font-size="10.5" fill="#6f665e" text-anchor="end">3</text><circle cx="30" cy="272" r="3.5" fill="#6fa8d6"/><text x="42" y="276" font-size="12" fill="#ddd5cb">Wire checkout to the tax rules</text><circle cx="30" cy="294" r="3.5" fill="#85b06b"/><text x="42" y="298" font-size="12" fill="#ddd5cb">Seed the spring catalogue</text><text x="42" y="320" font-size="12" fill="#9b8f84">Review: supplier onboarding</text><text x="20" y="350" font-size="11" fill="#f2ece4" font-weight="700">BRIGHTSIDE</text><text x="220" y="350" font-size="10.5" fill="#6f665e" text-anchor="end">1</text><circle cx="30" cy="368" r="3.5" fill="#6fa8d6"/><text x="42" y="372" font-size="12" fill="#ddd5cb">Landing page copy, second pass</text><text x="20" y="402" font-size="11" fill="#f2ece4" font-weight="700">pergula</text><text x="220" y="402" font-size="10.5" fill="#6f665e" text-anchor="end">1</text><circle cx="30" cy="420" r="3.5" fill="#85b06b"/><text x="42" y="424" font-size="12" fill="#ddd5cb">Two-line header for portrait</text><g clip-path="url(#pane)"><g class="pa">
    <rect x="241" y="29" width="519" height="58" fill="#191614"/>
    <line x1="241" y1="87.5" x2="760" y2="87.5" stroke="#322c28"/>
    <circle cx="266" cy="51" r="5" fill="#c0e021"/>
    <text x="280" y="56" font-size="14" fill="#f2ece4" font-weight="600">Wire checkout to the tax rules</text>
    <text x="280" y="76" font-size="11.5" fill="#6f665e">~/Work/orchard · main</text>
    
<text x="274" y="106" font-size="10.5" fill="#6fa8d6" font-weight="700" letter-spacing=".08em">YOU</text><rect x="274" y="116" width="452" height="60" rx="10" fill="#171d24" stroke="#322c28"/><rect x="274" y="116" width="3" height="60" fill="#6fa8d6"/><text x="294" y="139" font-size="13" fill="#ddd5cb">The tax table changed on the first. Make checkout</text><text x="294" y="158" font-size="13" fill="#ddd5cb">read the new rates and keep the old ones for refunds.</text><text x="274" y="206" font-size="10.5" fill="#d97757" font-weight="700" letter-spacing=".08em">CLAUDE</text><rect x="274" y="216" width="452" height="94" rx="10" fill="#1f1a17" stroke="#322c28"/><rect x="274" y="216" width="3" height="94" fill="#d97757"/><text x="294" y="239" font-size="13" fill="#ddd5cb">Done. Rates now come from the dated table, so a</text><text x="294" y="258" font-size="13" fill="#ddd5cb">refund uses the rate of the day it was paid.</text><rect x="294" y="270" width="250" height="26" rx="6" fill="#12100e" stroke="#322c28"/><text x="304" y="287" font-size="11.5" fill="#ddd5cb" class="mono">checkout/tax.py  +48 −12</text><text x="274" y="340" font-size="10.5" fill="#85b06b" font-weight="700" letter-spacing=".08em">COMMAND</text><rect x="274" y="350" width="452" height="41" rx="10" fill="#171c16" stroke="#322c28"/><rect x="274" y="350" width="3" height="41" fill="#85b06b"/><text x="294" y="373" font-size="11.5" fill="#ddd5cb" class="mono">make test  ·  212 passed</text></g><g class="pb">
    <rect x="241" y="29" width="519" height="58" fill="#191614"/>
    <line x1="241" y1="87.5" x2="760" y2="87.5" stroke="#322c28"/>
    <circle cx="266" cy="51" r="5" fill="#c0e021"/>
    <text x="280" y="56" font-size="14" fill="#f2ece4" font-weight="600">Reconcile the March imports</text>
    <text x="280" y="76" font-size="11.5" fill="#6f665e">~/Work/ledger · main</text>
    
<text x="274" y="106" font-size="10.5" fill="#6fa8d6" font-weight="700" letter-spacing=".08em">YOU</text><rect x="274" y="116" width="452" height="60" rx="10" fill="#171d24" stroke="#322c28"/><rect x="274" y="116" width="3" height="60" fill="#6fa8d6"/><text x="294" y="139" font-size="13" fill="#ddd5cb">Three rows in March do not match the bank.</text><text x="294" y="158" font-size="13" fill="#ddd5cb">Find out why before we close the month.</text><text x="274" y="206" font-size="10.5" fill="#d97757" font-weight="700" letter-spacing=".08em">CLAUDE</text><rect x="274" y="216" width="452" height="94" rx="10" fill="#1f1a17" stroke="#322c28"/><rect x="274" y="216" width="3" height="94" fill="#d97757"/><text x="294" y="239" font-size="13" fill="#ddd5cb">Two are one import run twice on the 14th; the third</text><text x="294" y="258" font-size="13" fill="#ddd5cb">is a fee the bank books a day late.</text><rect x="294" y="270" width="250" height="26" rx="6" fill="#12100e" stroke="#322c28"/><text x="304" y="287" font-size="11.5" fill="#ddd5cb" class="mono">imports/march.csv  3 rows</text><text x="274" y="340" font-size="10.5" fill="#85b06b" font-weight="700" letter-spacing=".08em">COMMAND</text><rect x="274" y="350" width="452" height="41" rx="10" fill="#171c16" stroke="#322c28"/><rect x="274" y="350" width="3" height="41" fill="#85b06b"/><text x="294" y="373" font-size="11.5" fill="#ddd5cb" class="mono">python reconcile.py --month 3  ·  0 left</text></g><g class="pc">
    <rect x="241" y="29" width="519" height="58" fill="#191614"/>
    <line x1="241" y1="87.5" x2="760" y2="87.5" stroke="#322c28"/>
    <circle cx="266" cy="51" r="5" fill="#c0e021"/>
    <text x="280" y="56" font-size="14" fill="#f2ece4" font-weight="600">Landing page copy, second pass</text>
    <text x="280" y="76" font-size="11.5" fill="#6f665e">~/Work/brightside · copy-pass</text>
    
<text x="274" y="106" font-size="10.5" fill="#6fa8d6" font-weight="700" letter-spacing=".08em">YOU</text><rect x="274" y="116" width="452" height="60" rx="10" fill="#171d24" stroke="#322c28"/><rect x="274" y="116" width="3" height="60" fill="#6fa8d6"/><text x="294" y="139" font-size="13" fill="#ddd5cb">Shorter. No heading over six words,</text><text x="294" y="158" font-size="13" fill="#ddd5cb">and lose the second testimonial.</text><text x="274" y="206" font-size="10.5" fill="#d97757" font-weight="700" letter-spacing=".08em">CLAUDE</text><rect x="274" y="216" width="452" height="94" rx="10" fill="#1f1a17" stroke="#322c28"/><rect x="274" y="216" width="3" height="94" fill="#d97757"/><text x="294" y="239" font-size="13" fill="#ddd5cb">Five sections now. The hero reads</text><text x="294" y="258" font-size="13" fill="#ddd5cb">“Bright books, fair prices.”</text><rect x="294" y="270" width="250" height="26" rx="6" fill="#12100e" stroke="#322c28"/><text x="304" y="287" font-size="11.5" fill="#ddd5cb" class="mono">src/pages/index.astro  +9 −31</text><text x="274" y="340" font-size="10.5" fill="#85b06b" font-weight="700" letter-spacing=".08em">COMMAND</text><rect x="274" y="350" width="452" height="41" rx="10" fill="#171c16" stroke="#322c28"/><rect x="274" y="350" width="3" height="41" fill="#85b06b"/><text x="294" y="373" font-size="11.5" fill="#ddd5cb" class="mono">npm run build  ·  12 pages</text></g></g><g class="k6"><rect x="466" y="414" width="64" height="30" rx="7" fill="#232020" stroke="#9b8f84"/><text x="498.0" y="434" font-size="13" fill="#f2ece4" font-weight="600" text-anchor="middle">⌘ 6</text></g><g class="k3"><rect x="466" y="414" width="64" height="30" rx="7" fill="#232020" stroke="#9b8f84"/><text x="498.0" y="434" font-size="13" fill="#f2ece4" font-weight="600" text-anchor="middle">⌘ 3</text></g><circle class="ripple rp" cx="150" cy="168" r="22" fill="#c0e021"/><g class="cursor"><path d="M0 0 L0 17 L4.5 13 L7.5 20 L10.5 18.8 L7.6 12 L13 12 Z" fill="#f2ece4" stroke="#14120f" stroke-width="1.2" stroke-linejoin="round"/></g>  </g>

  <rect x=".5" y=".5" width="759" height="459" rx="12" fill="none" stroke="#322c28"/>
</svg>
