<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-labelledby="title desc">
  <title id="title">Agent states in pergula</title>
  <desc id="desc">Each open agent carries a light: working, ready, needs you or error. Waiting agents are counted in the window title.</desc>

  <!-- Colours are the :root tokens in pergula. The projects and sessions are made up. -->
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ripple { transform-box: fill-box; transform-origin: center; }

    .w1 { animation: w1 10s step-end infinite; }
    .n1 { animation: n1 10s step-end infinite; }
    .w2 { animation: w2 10s step-end infinite; }
    .r2 { animation: r2 10s step-end infinite; }
    .t0 { animation: t0 10s step-end infinite; }
    .t1 { animation: t1 10s step-end infinite; }
    .cursor { animation: cur 10s ease-in-out infinite; }
    .rp { animation: rp 10s ease-out infinite; }
    @keyframes w1 { 0% { opacity: 1; } 22% { opacity: 0; } 72% { opacity: 1; } }
    @keyframes n1 { 0% { opacity: 0; } 22% { opacity: 1; } 72% { opacity: 0; } }
    @keyframes w2 { 0% { opacity: 1; } 44% { opacity: 0; } 96% { opacity: 1; } }
    @keyframes r2 { 0% { opacity: 0; } 44% { opacity: 1; } 96% { opacity: 0; } }
    @keyframes t0 { 0% { opacity: 1; } 22% { opacity: 0; } 72% { opacity: 1; } }
    @keyframes t1 { 0% { opacity: 0; } 22% { opacity: 1; } 72% { opacity: 0; } }
    @keyframes cur { 0%, 52% { opacity: 0; transform: translate(560px, 330px); } 55% { opacity: 1; transform: translate(560px, 330px); } 68%, 71% { opacity: 1; transform: translate(150px, 168px); } 70% { transform: translate(150px, 168px) scale(.9); } 82% { opacity: 1; transform: translate(150px, 168px); } 86%, 100% { opacity: 0; transform: translate(150px, 168px); } }
    @keyframes rp { 0%, 70% { opacity: 0; transform: scale(.2); } 71% { opacity: .55; transform: scale(.4); } 78%, 100% { opacity: 0; transform: scale(1.6); } }
    /* Without motion, the frame that shows the feature. */
    @media (prefers-reduced-motion: reduce) {
      .w1, .n1, .w2, .r2, .t0, .t1, .cursor, .rp { animation: none; }
      .w1, .r2, .t0, .cursor, .rp { opacity: 0; }
    }
  </style>

  <defs>
    <clipPath id="window"><rect width="760" height="460" rx="12"/></clipPath>
    <clipPath id="rail"><rect x="0" y="28" width="240" height="432"/></clipPath>
    <clipPath id="pane"><rect x="241" y="29" width="519" height="431"/></clipPath>
  </defs>

  <g clip-path="url(#window)">
    <rect width="760" height="460" fill="#14120f"/>

    <rect width="760" height="28" fill="#191614"/>
    <circle cx="16" cy="14" r="5" fill="#ec6a5e"/>
    <circle cx="32" cy="14" r="5" fill="#f4bf4f"/>
    <circle cx="48" cy="14" r="5" fill="#61c554"/>
    <g class="t0"><text x="380" y="18" font-size="11" fill="#6f665e" text-anchor="middle">pergula</text></g><g class="t1"><text x="380" y="18" font-size="11" fill="#f0a03c" font-weight="600" text-anchor="middle">(1) pergula</text></g>
    <line x1="0" y1="28.5" x2="760" y2="28.5" stroke="#322c28"/>

    <rect x="0" y="29" width="240" height="431" fill="#191614"/>
    <line x1="240.5" y1="29" x2="240.5" y2="460" stroke="#322c28"/>
    <g transform="translate(20 46) scale(.05)" fill="#c0e021">
      <path d="M32 32 L480 32 L480 128 L32 128 Z"/>
      <path d="M32 192 L288 192 L352 288 L32 288 Z"/>
      <path d="M288 352 L480 352 L480 448 L352 448 Z"/>
    </g>
    <text x="50" y="65" font-size="19" fill="#c0e021" font-weight="600">pergula</text>

    <rect x="16.5" y="88.5" width="207" height="30" rx="8" fill="#12100e" stroke="#322c28"/>
    <text x="28" y="108" font-size="11.5" fill="#6f665e">filter project or session</text>

    <rect x="16.5" y="128.5" width="102" height="24" rx="8" fill="#2a3210" stroke="#c0e021"/>
    <text x="67.5" y="145" font-size="11.5" fill="#f2ece4" text-anchor="middle">active</text>
    <rect x="121.5" y="128.5" width="102" height="24" rx="8" fill="none" stroke="#322c28"/>
    <text x="172.5" y="145" font-size="11.5" fill="#9b8f84" text-anchor="middle">all</text>
<text x="20" y="184" font-size="11" fill="#f2ece4" font-weight="700">ORCHARD</text><text x="220" y="184" font-size="10.5" fill="#6f665e" text-anchor="end">1</text><rect x="10" y="191" width="220" height="22" rx="6" fill="#232020"/><rect x="10" y="191" width="2.5" height="22" fill="#c0e021"/><g class="w1"><circle cx="30" cy="202" r="3.5" fill="#6fa8d6"/><text x="42" y="206" font-size="12" fill="#f2ece4">Checkout tax rules</text><text x="220" y="206" font-size="10.5" fill="#6f665e" text-anchor="end">2m</text></g><g class="n1"><circle cx="30" cy="202" r="3.5" fill="#f0a03c"/><text x="42" y="206" font-size="12" fill="#f2ece4">Checkout tax rules</text><text x="220" y="206" font-size="10.5" fill="#f0a03c" font-weight="600" text-anchor="end">needs you</text></g><text x="20" y="236" font-size="11" fill="#f2ece4" font-weight="700">LEDGER</text><text x="220" y="236" font-size="10.5" fill="#6f665e" text-anchor="end">1</text><g class="w2"><circle cx="30" cy="254" r="3.5" fill="#6fa8d6"/><text x="42" y="258" font-size="12" fill="#ddd5cb">March imports</text><text x="220" y="258" font-size="10.5" fill="#6f665e" text-anchor="end">6m</text></g><g class="r2"><circle cx="30" cy="254" r="3.5" fill="#85b06b"/><text x="42" y="258" font-size="12" fill="#ddd5cb">March imports</text><text x="220" y="258" font-size="10.5" fill="#6f665e" text-anchor="end">now</text></g><text x="20" y="288" font-size="11" fill="#f2ece4" font-weight="700">atlas-api</text><text x="220" y="288" font-size="10.5" fill="#6f665e" text-anchor="end">1</text><circle cx="30" cy="306" r="3.5" fill="#85b06b"/><text x="42" y="310" font-size="12" fill="#ddd5cb">Public rate limits</text><text x="220" y="310" font-size="10.5" fill="#6f665e" text-anchor="end">1h</text><text x="20" y="340" font-size="11" fill="#f2ece4" font-weight="700">BRIGHTSIDE</text><text x="220" y="340" font-size="10.5" fill="#6f665e" text-anchor="end">1</text><circle cx="30" cy="358" r="3.5" fill="#e06c62"/><text x="42" y="362" font-size="12" fill="#ddd5cb">Landing copy</text><text x="220" y="362" font-size="10.5" fill="#e06c62" font-weight="600" text-anchor="end">error</text>
    <rect x="241" y="29" width="519" height="58" fill="#191614"/>
    <line x1="241" y1="87.5" x2="760" y2="87.5" stroke="#322c28"/>
    <circle cx="266" cy="51" r="5" fill="#c0e021"/>
    <text x="280" y="56" font-size="14" fill="#f2ece4" font-weight="600">Wire checkout to the tax rules</text>
    <text x="280" y="76" font-size="11.5" fill="#6f665e">~/Work/orchard · main</text>
    
<text x="274" y="106" font-size="10.5" fill="#6fa8d6" font-weight="700" letter-spacing=".08em">YOU</text><rect x="274" y="116" width="452" height="60" rx="10" fill="#171d24" stroke="#322c28"/><rect x="274" y="116" width="3" height="60" fill="#6fa8d6"/><text x="294" y="139" font-size="13" fill="#ddd5cb">The tax table changed on the first. Make checkout</text><text x="294" y="158" font-size="13" fill="#ddd5cb">read the new rates and keep the old ones for refunds.</text><text x="274" y="206" font-size="10.5" fill="#d97757" font-weight="700" letter-spacing=".08em">CLAUDE</text><rect x="274" y="216" width="452" height="94" rx="10" fill="#1f1a17" stroke="#322c28"/><rect x="274" y="216" width="3" height="94" fill="#d97757"/><text x="294" y="239" font-size="13" fill="#ddd5cb">Done. Rates now come from the dated table, so a</text><text x="294" y="258" font-size="13" fill="#ddd5cb">refund uses the rate of the day it was paid.</text><rect x="294" y="270" width="250" height="26" rx="6" fill="#12100e" stroke="#322c28"/><text x="304" y="287" font-size="11.5" fill="#ddd5cb" class="mono">checkout/tax.py  +48 −12</text><text x="274" y="340" font-size="10.5" fill="#85b06b" font-weight="700" letter-spacing=".08em">COMMAND</text><rect x="274" y="350" width="452" height="41" rx="10" fill="#171c16" stroke="#322c28"/><rect x="274" y="350" width="3" height="41" fill="#85b06b"/><text x="294" y="373" font-size="11.5" fill="#ddd5cb" class="mono">make test  ·  212 passed</text><rect x="274.5" y="404.5" width="452" height="40" rx="10" fill="#1c1917" stroke="#322c28"/><circle cx="290" cy="424" r="4" fill="#6fa8d6"/><text x="300" y="428" font-size="11.5" fill="#ddd5cb">working</text><circle cx="392.2" cy="424" r="4" fill="#85b06b"/><text x="402.2" y="428" font-size="11.5" fill="#ddd5cb">ready</text><circle cx="481.2" cy="424" r="4" fill="#f0a03c"/><text x="491.2" y="428" font-size="11.5" fill="#ddd5cb">needs you</text><circle cx="596.6" cy="424" r="4" fill="#e06c62"/><text x="606.6" y="428" font-size="11.5" fill="#ddd5cb">error</text><circle class="ripple rp" cx="150" cy="202" r="22" fill="#c0e021"/><g class="cursor"><path d="M0 0 L0 17 L4.5 13 L7.5 20 L10.5 18.8 L7.6 12 L13 12 Z" fill="#f2ece4" stroke="#14120f" stroke-width="1.2" stroke-linejoin="round"/></g>  </g>

  <rect x=".5" y=".5" width="759" height="459" rx="12" fill="none" stroke="#322c28"/>
</svg>
