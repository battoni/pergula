<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460" role="img" aria-labelledby="title desc">
  <title id="title">The snippet palette in pergula</title>
  <desc id="desc">cmd+K opens the palette over the transcript; a few letters and enter put the prompt on the clipboard.</desc>

  <!-- Colours are the :root tokens in pergula. The projects and sessions are made up. -->
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ripple { transform-box: fill-box; transform-origin: center; }

    .dim { animation: dim 9s ease-in-out infinite; }
    .sheet { animation: sheet 9s ease-in-out infinite; }
    .ph { animation: ph 9s step-end infinite; }
    .ty0 { animation: ty0 9s step-end infinite; }
    .ty1 { animation: ty1 9s step-end infinite; }
    .ty2 { animation: ty2 9s step-end infinite; }
    .all { animation: all 9s step-end infinite; }
    .rev { animation: rev 9s step-end infinite; }
    .kk { animation: kk 9s ease-out infinite; }
    .ke { animation: ke 9s ease-out infinite; }
    .toast { animation: toast 9s ease-in-out infinite; }
    .caret { animation: caret 1s step-end infinite; }
    @keyframes dim { 0%, 10% { opacity: 0; } 13%, 56% { opacity: 1; } 59%, 100% { opacity: 0; } }
    @keyframes sheet { 0%, 10% { opacity: 0; transform: translateY(-8px); } 13%, 56% { opacity: 1; transform: translateY(0); } 59%, 100% { opacity: 0; transform: translateY(0); } }
    @keyframes ph { 0% { opacity: 1; } 24% { opacity: 0; } 99% { opacity: 1; } }
    @keyframes ty0 { 0% { opacity: 0; } 24% { opacity: 1; } 29% { opacity: 0; } }
    @keyframes ty1 { 0% { opacity: 0; } 29% { opacity: 1; } 34% { opacity: 0; } }
    @keyframes ty2 { 0% { opacity: 0; } 34% { opacity: 1; } 99% { opacity: 0; } }
    @keyframes all { 0% { opacity: 1; } 34% { opacity: 0; } 99% { opacity: 1; } }
    @keyframes rev { 0% { opacity: 0; } 34% { opacity: 1; } 99% { opacity: 0; } }
    @keyframes caret { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes kk { 0%, 4% { opacity: 0; transform: translateY(6px); } 6%, 16% { opacity: 1; transform: translateY(0); } 20%, 100% { opacity: 0; transform: translateY(0); } }
    @keyframes ke { 0%, 44% { opacity: 0; transform: translateY(6px); } 46%, 56% { opacity: 1; transform: translateY(0); } 60%, 100% { opacity: 0; transform: translateY(0); } }
    @keyframes toast { 0%, 56% { opacity: 0; transform: translateY(-6px); } 59%, 86% { opacity: 1; transform: translateY(0); } 90%, 100% { opacity: 0; transform: translateY(0); } }
    /* Without motion, the frame that shows the feature. */
    @media (prefers-reduced-motion: reduce) {
      .dim, .sheet, .ph, .ty0, .ty1, .ty2, .all, .rev, .kk, .ke, .toast, .caret { animation: none; }
      .ph, .ty0, .ty1, .all, .kk, .ke, .toast { opacity: 0; }
    }
  </style>

  <defs>
    <clipPath id="window"><rect width="760" height="460" rx="12"/></clipPath>
    <clipPath id="rail"><rect x="0" y="28" width="240" height="432"/></clipPath>
    <clipPath id="pane"><rect x="241" y="29" width="519" height="431"/></clipPath>
  </defs>

  <g clip-path="url(#window)">
    <rect width="760" height="460" fill="#14120f"/>

    <rect width="760" height="28" fill="#191614"/>
    <circle cx="16" cy="14" r="5" fill="#ec6a5e"/>
    <circle cx="32" cy="14" r="5" fill="#f4bf4f"/>
    <circle cx="48" cy="14" r="5" fill="#61c554"/>
    <text x="380" y="18" font-size="11" fill="#6f665e" text-anchor="middle">pergula</text>
    <line x1="0" y1="28.5" x2="760" y2="28.5" stroke="#322c28"/>

    <rect x="0" y="29" width="240" height="431" fill="#191614"/>
    <line x1="240.5" y1="29" x2="240.5" y2="460" stroke="#322c28"/>
    <g transform="translate(20 46) scale(.05)" fill="#c0e021">
      <path d="M32 32 L480 32 L480 128 L32 128 Z"/>
      <path d="M32 192 L288 192 L352 288 L32 288 Z"/>
      <path d="M288 352 L480 352 L480 448 L352 448 Z"/>
    </g>
    <text x="50" y="65" font-size="19" fill="#c0e021" font-weight="600">pergula</text>

    <rect x="16.5" y="88.5" width="207" height="30" rx="8" fill="#12100e" stroke="#322c28"/>
    <text x="28" y="108" font-size="11.5" fill="#6f665e">filter project or session</text>
<rect x="10" y="261" width="220" height="22" rx="6" fill="#232020"/><rect x="10" y="261" width="2.5" height="22" fill="#c0e021"/><text x="20" y="150" font-size="11" fill="#f2ece4" font-weight="700">LEDGER</text><text x="220" y="150" font-size="10.5" fill="#6f665e" text-anchor="end">1</text><circle cx="30" cy="168" r="3.5" fill="#85b06b"/><text x="42" y="172" font-size="12" fill="#ddd5cb">Reconcile the March imports</text><text x="20" y="202" font-size="11" fill="#f2ece4" font-weight="700">atlas-api</text><text x="220" y="202" font-size="10.5" fill="#6f665e" text-anchor="end">1</text><circle cx="30" cy="220" r="3.5" fill="#f0a03c"/><text x="42" y="224" font-size="12" fill="#ddd5cb">Rate limits on the public routes</text><text x="20" y="254" font-size="11" fill="#f2ece4" font-weight="700">ORCHARD</text><text x="220" y="254" font-size="10.5" fill="#6f665e" text-anchor="end">3</text><circle cx="30" cy="272" r="3.5" fill="#6fa8d6"/><text x="42" y="276" font-size="12" fill="#ddd5cb">Wire checkout to the tax rules</text><circle cx="30" cy="294" r="3.5" fill="#85b06b"/><text x="42" y="298" font-size="12" fill="#ddd5cb">Seed the spring catalogue</text><text x="42" y="320" font-size="12" fill="#9b8f84">Review: supplier onboarding</text><text x="20" y="350" font-size="11" fill="#f2ece4" font-weight="700">BRIGHTSIDE</text><text x="220" y="350" font-size="10.5" fill="#6f665e" text-anchor="end">1</text><circle cx="30" cy="368" r="3.5" fill="#6fa8d6"/><text x="42" y="372" font-size="12" fill="#ddd5cb">Landing page copy, second pass</text><text x="20" y="402" font-size="11" fill="#f2ece4" font-weight="700">pergula</text><text x="220" y="402" font-size="10.5" fill="#6f665e" text-anchor="end">1</text><circle cx="30" cy="420" r="3.5" fill="#85b06b"/><text x="42" y="424" font-size="12" fill="#ddd5cb">Two-line header for portrait</text>
    <rect x="241" y="29" width="519" height="58" fill="#191614"/>
    <line x1="241" y1="87.5" x2="760" y2="87.5" stroke="#322c28"/>
    <circle cx="266" cy="51" r="5" fill="#c0e021"/>
    <text x="280" y="56" font-size="14" fill="#f2ece4" font-weight="600">Wire checkout to the tax rules</text>
    <text x="280" y="76" font-size="11.5" fill="#6f665e">~/Work/orchard · main</text>
    
<text x="274" y="106" font-size="10.5" fill="#6fa8d6" font-weight="700" letter-spacing=".08em">YOU</text><rect x="274" y="116" width="452" height="60" rx="10" fill="#171d24" stroke="#322c28"/><rect x="274" y="116" width="3" height="60" fill="#6fa8d6"/><text x="294" y="139" font-size="13" fill="#ddd5cb">The tax table changed on the first. Make checkout</text><text x="294" y="158" font-size="13" fill="#ddd5cb">read the new rates and keep the old ones for refunds.</text><text x="274" y="206" font-size="10.5" fill="#d97757" font-weight="700" letter-spacing=".08em">CLAUDE</text><rect x="274" y="216" width="452" height="94" rx="10" fill="#1f1a17" stroke="#322c28"/><rect x="274" y="216" width="3" height="94" fill="#d97757"/><text x="294" y="239" font-size="13" fill="#ddd5cb">Done. Rates now come from the dated table, so a</text><text x="294" y="258" font-size="13" fill="#ddd5cb">refund uses the rate of the day it was paid.</text><rect x="294" y="270" width="250" height="26" rx="6" fill="#12100e" stroke="#322c28"/><text x="304" y="287" font-size="11.5" fill="#ddd5cb" class="mono">checkout/tax.py  +48 −12</text><text x="274" y="340" font-size="10.5" fill="#85b06b" font-weight="700" letter-spacing=".08em">COMMAND</text><rect x="274" y="350" width="452" height="41" rx="10" fill="#171c16" stroke="#322c28"/><rect x="274" y="350" width="3" height="41" fill="#85b06b"/><text x="294" y="373" font-size="11.5" fill="#ddd5cb" class="mono">make test  ·  212 passed</text><rect class="dim" x="0" y="0" width="760" height="460" fill="#000" fill-opacity=".45"/><g class="sheet">
      <rect x="186.5" y="110.5" width="387" height="228" rx="12" fill="#1c1917" stroke="#322c28"/>
      <line x1="187" y1="152.5" x2="573" y2="152.5" stroke="#322c28"/>
      <text x="206" y="136" font-size="13" fill="#6f665e" class="ph">copy a snippet… (enter copies)</text>
      <text x="206" y="136" font-size="13" fill="#f2ece4" class="ty0">r</text><text x="206" y="136" font-size="13" fill="#f2ece4" class="ty1">re</text><text x="206" y="136" font-size="13" fill="#f2ece4" class="ty2">rev</text>
      <g class="all"><rect x="196" y="162" width="368" height="30" rx="7" fill="#2a3210"/><text x="210" y="182" font-size="12.5" fill="#f2ece4">Review the diff before commit</text><text x="550" y="182" font-size="11" fill="#6f665e" text-anchor="end">review</text><text x="210" y="216" font-size="12.5" fill="#ddd5cb">Write the commit message</text><text x="550" y="216" font-size="11" fill="#6f665e" text-anchor="end">git</text><text x="210" y="250" font-size="12.5" fill="#ddd5cb">Explain it as a PR description</text><text x="550" y="250" font-size="11" fill="#6f665e" text-anchor="end">docs</text><text x="210" y="284" font-size="12.5" fill="#ddd5cb">Tests first, then the fix</text><text x="550" y="284" font-size="11" fill="#6f665e" text-anchor="end">code</text><text x="210" y="318" font-size="12.5" fill="#ddd5cb">Resume where we stopped</text><text x="550" y="318" font-size="11" fill="#6f665e" text-anchor="end">sessions</text></g>
      <g class="rev"><rect x="196" y="162" width="368" height="30" rx="7" fill="#2a3210"/><text x="210" y="182" font-size="12.5" fill="#f2ece4">Review the diff before commit</text><text x="550" y="182" font-size="11" fill="#6f665e" text-anchor="end">review</text><text x="210" y="216" font-size="12.5" fill="#ddd5cb">Review: security pass</text><text x="550" y="216" font-size="11" fill="#6f665e" text-anchor="end">review</text></g>
    </g><g class="toast">
      <rect x="628" y="43" width="108" height="30" rx="8" fill="#2a3210" stroke="#c0e021"/>
      <text x="682" y="63" font-size="12.5" fill="#f2ece4" font-weight="600" text-anchor="middle">✓ copied</text>
    </g><g class="kk"><rect x="466" y="414" width="64" height="30" rx="7" fill="#232020" stroke="#9b8f84"/><text x="498.0" y="434" font-size="13" fill="#f2ece4" font-weight="600" text-anchor="middle">⌘ K</text></g><g class="ke"><rect x="466" y="414" width="84" height="30" rx="7" fill="#232020" stroke="#9b8f84"/><text x="508.0" y="434" font-size="13" fill="#f2ece4" font-weight="600" text-anchor="middle">↵ enter</text></g>  </g>

  <rect x=".5" y=".5" width="759" height="459" rx="12" fill="none" stroke="#322c28"/>
</svg>
